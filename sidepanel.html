<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markerly</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand-mark">M</div>
        <div class="brand-copy"><h1>Markerly</h1><p id="pageTitle" data-i18n="currentPage">Current page</p></div>
        <label class="switch" data-i18n-aria-label="toggleCanvas" aria-label="Toggle canvas">
          <input id="enabled" type="checkbox" /><span></span>
        </label>
      </header>

      <section id="blocked" class="blocked" hidden>
        <span>!</span>
        <div><strong data-i18n="blockedTitle">Markerly cannot run on this page</strong><p data-i18n="blockedDescription">Open a regular webpage and try again.</p></div>
      </section>

      <div id="workspace">
        <section class="card">
          <div class="section-heading"><h2 data-i18n="chooseTool">Choose a tool</h2><span id="toolLabel">Pen</span></div>
          <div class="tool-grid">
            <button class="tool active" data-action="pen" type="button"><span>✎</span><span data-i18n="draw">Draw</span></button>
            <button class="tool" data-action="eraser" type="button"><span>◇</span><span data-i18n="erase">Erase</span></button>
            <button class="tool" data-action="text" type="button"><span>T</span><span data-i18n="textTool">Text</span></button>
            <button class="tool" data-action="navigate" type="button"><span>↗</span><span data-i18n="pageTool">Page</span></button>
          </div>

          <div id="colorArea" class="field">
            <div class="field-label"><label for="color" data-i18n="color">Color</label><output id="colorValue">#FF4D6D</output></div>
            <div class="colors">
              <input id="color" type="color" value="#ff4d6d" />
              <button class="swatch active" style="--color:#ff4d6d" data-color="#ff4d6d" data-i18n-aria-label="pink" aria-label="Pink" type="button"></button>
              <button class="swatch" style="--color:#ffb020" data-color="#ffb020" data-i18n-aria-label="orange" aria-label="Orange" type="button"></button>
              <button class="swatch" style="--color:#2ecc71" data-color="#2ecc71" data-i18n-aria-label="green" aria-label="Green" type="button"></button>
              <button class="swatch" style="--color:#2684ff" data-color="#2684ff" data-i18n-aria-label="blue" aria-label="Blue" type="button"></button>
              <button class="swatch" style="--color:#111827" data-color="#111827" data-i18n-aria-label="black" aria-label="Black" type="button"></button>
            </div>
          </div>

          <div class="field"><div class="field-label"><label id="sizeLabel" for="size" data-i18n="thickness">Thickness</label><output id="sizeValue">32 px</output></div><input id="size" type="range" min="2" max="72" value="32" /></div>
          <div class="field"><div class="field-label"><label for="opacity" data-i18n="opacity">Opacity</label><output id="opacityValue">50%</output></div><input id="opacity" type="range" min="10" max="100" value="50" /></div>

          <label class="check-option">
            <input id="rightClickClear" type="checkbox" checked /><span class="check-box"></span>
            <span class="check-copy"><strong data-i18n="rightClickClear">Clear all with right-click</strong><small data-i18n="rightClickClearHelp">Quickly reset the drawing layer.</small></span>
          </label>
          <button id="save" class="save" type="button"><span>↓</span> <span data-i18n="saveCurrentView">Save current view</span></button>
          <div class="sequence-row"><label for="captureInterval" data-i18n="captureInterval">Capture interval</label><select id="captureInterval"><option value="3000" selected data-i18n="seconds3">3 seconds</option><option value="5000" data-i18n="seconds5">5 seconds</option><option value="10000" data-i18n="seconds10">10 seconds</option></select></div>
          <button id="sequence" class="sequence" type="button"><span class="sequence-dot"></span><span id="sequenceLabel" data-i18n="startSequence">Start sequence capture</span><output id="sequenceCount">0</output></button>
          <p class="sequence-help" data-i18n="sequenceHelp">The free version saves up to 10 captures in one ZIP file.</p>
          <button id="clear" class="clear" type="button" data-i18n="clearAll">Clear all drawings</button>
        </section>
        <p class="hint" data-i18n-html="navigationHint">Select <strong>Page</strong> when you need to control the video or webpage.</p>
      </div>
      <footer><span id="statusDot"></span><p id="status" data-i18n="canvasOff">Canvas off</p></footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
